<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenue - My Smart List</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.png">
    <meta name="theme-color" content="#0d6efd">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <style>
    :root {
      --primary: #0abde3;
      --secondary: #10ac84;
      --background: #0f2027;
      --glass: rgba(255, 255, 255, 0.1);
      --white: #fff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--background);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Background Video */
    .background-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      opacity: 0.2;
      pointer-events: none;
    }

    /* Background Lights */
    .lights {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(10, 189, 227, 0.2) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(16, 172, 132, 0.2) 0%, transparent 40%);
      animation: moveLights 10s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes moveLights {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: var(--background);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOutLoader 1s 2s forwards;
    }

    .loader::after {
      content: "";
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeOutLoader {
      to { opacity: 0; visibility: hidden; }
    }

    .content {
      text-align: center;
      padding: 20px;
      z-index: 1;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .highlight {
      color: var(--primary);
      animation: colorChange 6s infinite alternate;
    }

    @keyframes colorChange {
      0% { color: var(--primary); }
      50% { color: var(--secondary); }
      100% { color: var(--primary); }
    }

    .animated-subtitle {
      font-size: 1.3rem;
      margin-bottom: 40px;
      opacity: 0.8;
    }

    .start-button {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--white);
      text-decoration: none;
      box-shadow: 0 0 15px var(--primary);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .start-button::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      height: 300%;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.75s;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
    }

    .start-button:hover::after {
      transform: translate(-50%, -50%) scale(1);
    }

    .start-button:hover {
      box-shadow: 0 0 25px var(--secondary), 0 0 40px var(--primary);
      transform: translateY(-3px) scale(1.05);
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      .animated-subtitle { font-size: 1rem; }
    }
  </style>
</head>
<body>

<div class="loader"></div>

<video autoplay muted loop class="background-video">
  <source src="https://cdn.pixabay.com/video/2023/07/17/174866-842821517_large.mp4" type="video/mp4">
</video>

<div class="lights"></div>

<div class="content" data-aos="fade-up">
  <h1> <span class="highlight">My Smart List</span></h1>
  <div class="animated-subtitle" data-aos="fade-up" data-aos-delay="400">Simplifiez vos courses, gagnez du temps ✨</div>
  <a href="index2.html" class="start-button" data-aos="zoom-in" data-aos-delay="800">Commencer</a>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 1000,
    once: true
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('✅ SW enregistré', reg))
        .catch(err => console.error('❌ Erreur SW', err));
    });
  }
</script>


</body>
</html>
